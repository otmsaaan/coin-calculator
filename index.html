<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#222222"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="コイン計算"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>70,000円コイン計算ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px #0001}
h1{font-size:23px;margin:0 0 5px}.sub{color:#666;font-size:14px}h2{font-size:17px;margin:18px 0 9px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}
input{width:82px;padding:8px;border:1px solid #ccc;border-radius:9px;font-size:16px;text-align:right}
.settings{background:#f7f8fb;padding:12px;border-radius:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{font-size:12px;color:#666}.grid input{display:block;width:100%;margin-top:3px}
.line{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:13px}.line input{margin-left:auto;width:110px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.stat{background:#f0f2f6;border-radius:12px;padding:11px}
.small{font-size:12px;color:#666}.big{font-size:20px;font-weight:800}
button{border:0;border-radius:10px;padding:10px 13px;margin:10px 5px 0 0;font-weight:700;font-size:14px;background:#e8ebf1;cursor:pointer}.primary{background:#222;color:#fff}
textarea{width:100%;min-height:70px;margin-top:10px;padding:9px;border:1px solid #ccc;border-radius:10px;font:14px system-ui}
.set{border:1px solid #e1e4ea;border-radius:12px;padding:11px;margin-top:8px}.sale-check{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px;border-radius:9px;background:#f7f8fb;font-weight:700}.sale-check input{width:20px;height:20px;margin:0}.set.sold{opacity:.58;background:#f2f2f2}.set.sold h3,.set.sold li{text-decoration:line-through}.progress{font-size:13px;color:#555;margin-top:5px}.set h3{margin:0 0 6px;font-size:16px}ul{margin:5px 0;padding-left:20px}.ok{font-weight:700}.bad{color:#b42318;font-weight:700}
@media(max-width:480px){.wrap{padding:9px}.card{padding:12px}input{width:70px}}
</style></head>
<body><div class="wrap"><div class="card">
<h1>🪙 70,000円コイン計算ツール</h1><p class="sub">個数を入力して「最適計算」。売却額やコイン獲得ラインを変更した場合も、このボタンで計算に反映されます。</p>
<h2>⚙️ 売却額・コイン条件</h2><div class="settings"><div class="grid"><label>ライオン皮<input id="p0" type="number" min="0" value="12000"></label>
<label>ライオン肉<input id="p1" type="number" min="0" value="7200"></label>
<label>イノシシ皮<input id="p2" type="number" min="0" value="2160"></label>
<label>イノシシ肉<input id="p3" type="number" min="0" value="1680"></label>
<label>イノシシ牙<input id="p4" type="number" min="0" value="1920"></label>
<label>シカ皮<input id="p5" type="number" min="0" value="1680"></label>
<label>シカ肉<input id="p6" type="number" min="0" value="1200"></label>
<label>シカ角<input id="p7" type="number" min="0" value="1680"></label></div>
<div class="line">🪙 コイン獲得ライン <input id="threshold" type="number" min="0" value="70000"> 円以上</div>
<button onclick="resetSettings()">初期値に戻す</button></div>
<h2>📦 個数</h2><table><thead><tr><th>アイテム</th><th>売却額</th><th>個数</th><th>小計</th></tr></thead><tbody><tr><td>ライオン皮</td><td id="v0">12,000円</td><td><input id="q0" type="number" min="0" value="0"></td><td id="s0">0円</td></tr>
<tr><td>ライオン肉</td><td id="v1">7,200円</td><td><input id="q1" type="number" min="0" value="0"></td><td id="s1">0円</td></tr>
<tr><td>イノシシ皮</td><td id="v2">2,160円</td><td><input id="q2" type="number" min="0" value="0"></td><td id="s2">0円</td></tr>
<tr><td>イノシシ肉</td><td id="v3">1,680円</td><td><input id="q3" type="number" min="0" value="0"></td><td id="s3">0円</td></tr>
<tr><td>イノシシ牙</td><td id="v4">1,920円</td><td><input id="q4" type="number" min="0" value="0"></td><td id="s4">0円</td></tr>
<tr><td>シカ皮</td><td id="v5">1,680円</td><td><input id="q5" type="number" min="0" value="0"></td><td id="s5">0円</td></tr>
<tr><td>シカ肉</td><td id="v6">1,200円</td><td><input id="q6" type="number" min="0" value="0"></td><td id="s6">0円</td></tr>
<tr><td>シカ角</td><td id="v7">1,680円</td><td><input id="q7" type="number" min="0" value="0"></td><td id="s7">0円</td></tr></tbody></table>
<div class="stats"><div class="stat"><div class="small">総額</div><div class="big" id="total">0円</div></div>
<div class="stat"><div class="small">理論上の最大回数</div><div class="big" id="upper">0回</div></div></div>
<button class="primary" onclick="solve()">🪙 設定を反映して最適計算</button><button onclick="makeNumbers()">数字8個を作る</button><button onclick="clearAll()">クリア</button>
<textarea id="numbers" placeholder="数字8個を貼り付けてもOK&#10;例：44 44 20 20 40 10 10 20"></textarea>
<button onclick="loadNumbers()">↑ 数字8個を入力</button><div id="result"></div></div>
<div class="card small"><b>入力順</b><br>①ライオン皮　②ライオン肉　③イノシシ皮　④イノシシ肉<br>⑤イノシシ牙　⑥シカ皮　⑦シカ肉　⑧シカ角</div>
</div>
<script>
const NAMES=["ライオン皮", "ライオン肉", "イノシシ皮", "イノシシ肉", "イノシシ牙", "シカ皮", "シカ肉", "シカ角"],DEFAULT=[12000, 7200, 2160, 1680, 1920, 1680, 1200, 1680];
function q(id){return document.getElementById(id)}
function P(){return NAMES.map((_,i)=>Math.max(0,+q("p"+i).value||0))}
function C(){return NAMES.map((_,i)=>Math.max(0,+q("q"+i).value||0))}
function L(){return Math.max(0,+q("threshold").value||0)}
function V(g,p=P()){return g.reduce((s,x,i)=>s+x*p[i],0)}
function update(){
 let c=C(),p=P(),t=V(c,p);
 c.forEach((x,i)=>{
  q("v"+i).textContent=p[i].toLocaleString()+"円";
  q("s"+i).textContent=(x*p[i]).toLocaleString()+"円";
 });
 q("total").textContent=t.toLocaleString()+"円";
 q("upper").textContent=Math.floor(t/(L()||1))+"回";
}
document.querySelectorAll("input").forEach(x=>x.addEventListener("input",update));
function resetSettings(){DEFAULT.forEach((x,i)=>q("p"+i).value=x);q("threshold").value=70000;update()}
function loadNumbers(){
 const raw=q("numbers").value.trim();
 const normalized=raw.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xfee0)).replace(/[，、]/g,",").replace(/,/g," ");
 const a=(normalized.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
 if(a.length!==8){
  q("result").innerHTML='<div class="set bad">数字を8個入れてね。<br>例：44 44 20 20 40 10 10 20</div>';
  return;
 }
 a.forEach((x,i)=>q("q"+i).value=Math.max(0,Math.floor(x)));
 update();
 q("result").innerHTML='<div class="set"><span class="ok">8個の数字を読み込みました！</span><br>「設定を反映して最適計算」を押してね🪙</div>';
}
function makeNumbers(){q("numbers").value=C().join(" ")}
function clearAll(){
 for(let i=0;i<8;i++)q("q"+i).value=0;
 q("numbers").value="";
 q("result").innerHTML="";
 // クリアしたら、保存されている「売却済み」状態もリセット
 try{
   const raw=localStorage.getItem("coin-calculator-settings-v2");
   if(raw){
     const data=JSON.parse(raw);
     data.counts=C();
     data.numbers="";
     data.sold=[];
     localStorage.setItem("coin-calculator-settings-v2",JSON.stringify(data));
   }else{
     localStorage.removeItem("coin-calculator-settings-v2");
   }
 }catch(e){}
 update();
}
function bestOneSet(rem,p,min){
 if(min<=0)return null;
 const maxP=Math.max(...p);
 const limit=min+maxP-1;
 const dp=Array(limit+1).fill(null);
 dp[0]=Array(8).fill(0);
 for(let i=0;i<8;i++){
  const price=p[i],count=rem[i];
  if(price<=0||count<=0)continue;
  const next=dp.map(x=>x?x.slice():null);
  for(let sum=0;sum<=limit;sum++){
   if(!dp[sum])continue;
   for(let n=1;n<=count;n++){
    const ns=sum+price*n;
    if(ns>limit)break;
    if(!next[ns]){
     const a=dp[sum].slice();a[i]=n;next[ns]=a;
    }
   }
  }
  for(let s=0;s<=limit;s++)dp[s]=next[s];
 }
 for(let s=min;s<=limit;s++)if(dp[s])return {g:dp[s],value:s};
 return null;
}

function solve(){
 const init=C(),p=P(),min=L();
 const total=V(init,p);
 if(total<min){
  q("result").innerHTML='<div class="set bad">総額がコイン獲得ラインに届きません。</div>';
  return;
 }
 let rem=init.slice(),sets=[];
 while(V(rem,p)>=min){
  const one=bestOneSet(rem,p,min);
  if(!one)break;
  sets.push(one);
  for(let i=0;i<8;i++)rem[i]-=one.g[i];
 }
 if(!sets.length){
  q("result").innerHTML='<div class="set bad">組み合わせを見つけられませんでした。</div>';
  return;
 }
 let out='<div class="set"><b>🪙 '+sets.length+'セット</b>'+
  '<div class="progress">各セットは「'+min.toLocaleString()+'円以上」で、できるだけ'+min.toLocaleString()+'円に近い組み合わせです。余ったアイテムは残します。</div></div>';
 sets.forEach((one,i)=>{
  out+='<div class="set" id="set-'+i+'">';
  out+='<h3>🪙 '+(i+1)+'セット目：'+one.value.toLocaleString()+'円</h3><ul>';
  one.g.forEach((x,j)=>{if(x)out+='<li>'+NAMES[j]+' × '+x+'</li>'});
  out+='</ul>';
  out+='<label class="sale-check"><input type="checkbox" onchange="toggleSold('+i+',this.checked)"> 売却済み</label>';
  out+='</div>';
 });
 out+='<div class="set"><b>📦 残り</b><ul>';
 let remainValue=V(rem,p);
 rem.forEach((x,i)=>{if(x)out+='<li>'+NAMES[i]+' × '+x+'</li>'});
 if(rem.every(x=>x===0))out+='<li>なし</li>';
 out+='</ul><b>残り合計：'+remainValue.toLocaleString()+'円</b></div>';
 q("result").innerHTML=out;
}

function toggleSold(i,checked){
 const el=q("set-"+i);
 if(el)el.classList.toggle("sold",checked);
 try{localStorage.setItem("coin-sold-"+i,checked?"1":"0")}catch(e){}
}

update();
</script>
<script id="local-save-layer">
(function(){
  const STORAGE_KEY="coin-calculator-settings-v2";

  function getState(){
    return {
      prices: P(),
      threshold: L(),
      counts: C(),
      numbers: q("numbers").value,
      sold: [...document.querySelectorAll("#result .sale-check input")].map(x=>x.checked)
    };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getState()));
    }catch(e){}
  }

  function restoreState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const data=JSON.parse(raw);

      if(Array.isArray(data.prices)){
        data.prices.slice(0,8).forEach((v,i)=>q("p"+i).value=Math.max(0,+v||0));
      }
      if(data.threshold!=null) q("threshold").value=Math.max(0,+data.threshold||0);
      if(Array.isArray(data.counts)){
        data.counts.slice(0,8).forEach((v,i)=>q("q"+i).value=Math.max(0,Math.floor(+v||0)));
      }
      if(typeof data.numbers==="string") q("numbers").value=data.numbers;

      update();
      return data.sold || [];
    }catch(e){
      return [];
    }
  }

  function restoreSold(sold){
    if(!Array.isArray(sold)) return;
    document.querySelectorAll("#result .sale-check input").forEach((box,i)=>{
      if(sold[i]){
        box.checked=true;
        const set=q("set-"+i);
        if(set) set.classList.add("sold");
      }
    });
  }

  // Save whenever the user changes any setting/input.
  document.addEventListener("input", function(e){
    if(e.target.matches("input, textarea")) saveState();
  });

  document.addEventListener("change", function(e){
    if(e.target.matches("input, textarea")) saveState();
  });

  // Keep the existing "売却済み" function, but also persist the checkbox.
  if(typeof window.toggleSold==="function"){
    const originalToggle=window.toggleSold;
    window.toggleSold=function(i,checked){
      originalToggle(i,checked);
      saveState();
    };
  }

  // Restore saved settings whenever the page opens.
  const savedSold=restoreState();

  // If a calculation is made, restore the saved sold states for the new result.
  if(typeof window.solve==="function"){
    const originalSolve=window.solve;
    window.solve=function(){
      originalSolve();
      setTimeout(()=>{
        restoreSold(savedSold);
        saveState();
      },50);
    };
  }

  // Also save before the page/app is closed.
  window.addEventListener("pagehide", saveState);
})();
</script>

</body></html>
